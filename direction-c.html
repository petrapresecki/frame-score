<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame Score — C</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
</head>
<body>
  <div class="sheet">
    <h1>Frame Score</h1>
    <p class="sub">Grade a film frame and hear the grade. Drag any number.</p>

    <div class="body">
      <div class="dials"></div>

      <div>
        <div class="frame" id="frame">
          <canvas id="cv"></canvas>
          <span class="head">|</span>
        </div>

        <div class="verbs">
          <button class="verb" id="run" aria-pressed="false">Play</button>
          <span class="sources"></span>
          <button class="verb small" id="own">Own frame</button>
          <button class="verb small" id="reset">Reset</button>
        </div>

        <p class="reading"></p>
      </div>
    </div>
  </div>
  <input type="file" id="file" accept="image/*">
  <script type="module" src="/src/skins/c/ui.js"></script>
</body>
</html>
